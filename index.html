<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  <title>Results summary component</title>
</head>

<body>
  <main class="container">
    <div class="card">
      <div class="card-header">
        <p>Your Result</p>
        <div class="circle">
          <h1>76</h1>
          <p>of 100</p>
        </div>
        <h2>Great</h2>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </div>
      <div class="card-details">
        <h4>Summary</h4>
        <div class="reaction">
          <div>
            <img src="assets/images/icon-reaction.svg" alt="icon-reaction"> 
            <h5>Reaction</h4>
            </div>
          <p><span>80 </span> / 100</p>
        </div>
        <div class="Memory">
          <div>
            <img src="assets/images/icon-memory.svg" alt="icon-Memory"> 
            <h5>Memory</h5>
            </div>
          <p><span>92 </span> / 100</p>
        </div>
        <div class="Verbal">
          <div>
            <img src="assets/images/icon-verbal.svg" alt="icon-Verbal"> 
            <h5>Verbal</h4>
            </div>
          <p><span>61 </span>/ 100</p>
        </div>
        <div class="Visual">
          <div>
            <img src="assets/images/icon-visual.svg" alt="icon-Visual"> 
            <h5>Visual</h4>
            </div>
          <p><span>72 </span>/ 100</p>
        </div>
        <button>Continue</button>
      </div>
    </div>
  </main>
</body>

</html>
